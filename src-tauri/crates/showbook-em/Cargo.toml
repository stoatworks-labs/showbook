[package]
name = "showbook-em"
description = "Barco Event Master driver: the frame's XML store (settings.xml, presets, cues), E2/E3 backup archives, and the JSON-RPC API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
showbook-model = { path = "../showbook-model" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
roxmltree = "0.21"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["json"], optional = true }

# The live driver (JSON-RPC over HTTP) is the one part of this crate that needs
# a network stack; the store parser is what showbook-lite compiles to wasm.
[features]
default = ["live"]
live = ["dep:ureq"]
